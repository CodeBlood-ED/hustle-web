<section class="main">
  <form [formGroup]="loginForm" class="login-dialog" (ngSubmit)="onSubmit()">
    <h3>Login here!</h3>

    @if (errorMessage()) {
      <div class="auth-error-banner" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <div class="input-group">
      <input
        type="email"
        id="email"
        placeholder="Email"
        formControlName="email"
        [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        autocomplete="email"
      />
      <input
        type="password"
        id="password"
        placeholder="Password"
        formControlName="password"
        [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        autocomplete="current-password"
      />
    </div>

    <div class="button-group">
      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading()">
        {{ isLoading() ? 'Logging in...' : 'Go' }}
      </button>
      <button type="button" class="cancel-btn" (click)="onCancel()" [disabled]="isLoading()">Cancel</button>
    </div>

    <h3>
      <button type="button" class="switch-link" (click)="switchToRegister.emit()" [disabled]="isLoading()">
        Register here!
      </button>
    </h3>
  </form>
</section>
