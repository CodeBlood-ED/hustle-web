<div class="main">
    <form [formGroup]="signupform" class="registration-form" (ngSubmit)="onSubmit()">
        <h3>Create Account</h3>

        @if (errorMessage()) {
            <div class="auth-error-banner" role="alert">
                {{ errorMessage() }}
            </div>
        }

        <div class="input-group">
            <input type="text" id="name" placeholder="Name" formControlName="name" required autocomplete="name" />
        </div>
        <div class="input-group">
            <input type="email" placeholder="Email Address" formControlName="email" required autocomplete="email" />
        </div>
        <div class="input-group">
            <input type="tel" placeholder="Contact no." formControlName="contact" required autocomplete="tel" />
        </div>
        <div class="input-group">
            <input type="password" placeholder="Password" formControlName="password" required autocomplete="new-password" />
        </div>
        <a href="#" (click)="switchToLogin.emit(); $event.preventDefault()">Already have an account? </a>
        <div class="button-group">
            <button type="submit" id="submit-btn" [disabled]="signupform.invalid || isLoading()">
                {{ isLoading() ? 'Signing up...' : 'Sign Up' }}
            </button>
            <button type="button" id="close-btn" (click)="onCancel()" [disabled]="isLoading()">Cancel</button>
        </div>
    </form>
</div>
