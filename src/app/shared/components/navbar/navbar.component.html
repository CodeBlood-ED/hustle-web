<section>
    <a class="part1 wordmark" [routerLink]="['/landing']" aria-label="Hustle home">Hustle<span>.</span></a>
    <div class="part2">
        @for(eachItem of items; track eachItem.id) {
        <a [routerLink]="eachItem.page_address"><div class="sub-section">{{eachItem.name}}</div></a>
        }
    </div>
    <button class="mobile-menu-toggle" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen" aria-controls="mobile-navigation"
        [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'">
        <span class="menu-glyph" [class.is-open]="menuOpen" aria-hidden="true">
            <span></span><span></span><span></span>
        </span>
    </button>
    @if (menuOpen) {
        <nav class="mobile-navigation" id="mobile-navigation" aria-label="Mobile navigation">
            @for(eachItem of items; track eachItem.id) {
                <a [routerLink]="eachItem.page_address" (click)="closeMenu()">{{eachItem.name}}</a>
            }
        </nav>
    }
    <div class="part3">
        <button class="signUp" type="button" (click)="toggleRegistration()">Create an account</button>
        <button class="logIn" type="button" (click)="toggleLogin()">Login here!</button>
        <app-signup (cancel)="closeAuth()" (switchToLogin)="openLoginFromSignup()"></app-signup>
        <app-login (cancel)="closeAuth()" (switchToRegister)="openSignupFromLogin()"></app-login>
    </div>
</section>
