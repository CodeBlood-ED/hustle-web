<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Hustle Apple accessories logo</title>
  <desc id="desc">Minimal black and neon-lime Hustle logo with an H-shaped phone-case mark.</desc>

  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7FF00"/>
      <stop offset="100%" stop-color="#8DFF00"/>
    </linearGradient>
  </defs>

  <!-- H / phone-case emblem -->
  <g transform="translate(55 55)">
    <rect x="0" y="0" width="175" height="350" rx="34"
          fill="url(#lime)" stroke="#111" stroke-width="7"/>
    <rect x="205" y="0" width="175" height="350" rx="34"
          fill="#F8F8F8" stroke="#111" stroke-width="7"/>

    <!-- center cut-outs create the H -->
    <rect x="155" y="112" width="70" height="126" rx="16" fill="#fff"/>
    <rect x="205" y="112" width="70" height="126" rx="16" fill="#111"/>

    <!-- camera island -->
    <rect x="20" y="20" width="130" height="130" rx="28" fill="#0B0D0E"/>
    <circle cx="57" cy="57" r="24" fill="#171B1E" stroke="#69727A" stroke-width="5"/>
    <circle cx="113" cy="57" r="24" fill="#171B1E" stroke="#69727A" stroke-width="5"/>
    <circle cx="57" cy="113" r="24" fill="#171B1E" stroke="#69727A" stroke-width="5"/>
    <circle cx="57" cy="57" r="7" fill="#8FD5FF"/>
    <circle cx="113" cy="57" r="7" fill="#8FD5FF"/>
    <circle cx="57" cy="113" r="7" fill="#8FD5FF"/>
    <circle cx="120" cy="113" r="11" fill="#F4F4F4"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="245"
        font-family="Arial, Helvetica, sans-serif"
        font-size="168"
        font-weight="900"
        letter-spacing="3"
        fill="#101214">HUSTL</text>

  <!-- E with lime accent -->
  <text x="1175" y="245"
        font-family="Arial, Helvetica, sans-serif"
        font-size="168"
        font-weight="900"
        letter-spacing="3"
        fill="#101214">E</text>
  <rect x="1205" y="176" width="105" height="22" rx="4" fill="url(#lime)"/>

  <!-- Tagline -->
  <text x="505" y="330"
        font-family="Arial, Helvetica, sans-serif"
        font-size="38"
        font-weight="800"
        letter-spacing="8"
        fill="#B8FF00">ONLY APPLE. ONLY THE BEST.</text>

  <!-- subtle baseline -->
  <rect x="505" y="365" width="690" height="3" rx="2" fill="#B8FF00"/>
</svg>
